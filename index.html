<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portal Carousel</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="stage"></div>
  <div class="hint">Drag, scroll or use ↑ ↓</div>
  <aside class="panel" id="panel">
    <header><span>Parameters</span><span class="btns"><button id="replay" title="Replay the entry animation (R)">Replay</button><button id="copy" title="Copy settings as JSON">Copy</button><button id="reset" title="Reset all">↺</button></span></header>
    <p class="tip">Double-click a slider to reset it. G shows / hides this panel, R replays the entry.</p>
    <div id="controls"></div>
  </aside>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
